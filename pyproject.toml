[project]
name = "pointwise"
version = "0.1.0"
description = "Credit card rewards optimizer: deterministic rules engine + PayPal execution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "anthropic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pointwise"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
